<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miku Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#000000;
    --bg-void-2:#000000;
    --case-hi:#3a3d44;
    --case-mid:#1c1e22;
    --case-lo:#0c0d0f;
    --dial:#000000;
    --dial-edge:#000000;
    --teal:#39c5bb;
    --teal-dim:#1c5652;
    --teal-glow:rgba(57,197,187,0.35);
    --magenta:#ff2f8f;
    --magenta-dim:#7a1948;
    --magenta-glow:rgba(255,47,143,0.75);
    --ivory:#f3f2ee;
    --ivory-dim:#8b8c8f;
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
    background:
      radial-gradient(ellipse at 50% 30%, #101216 0%, var(--bg-void) 45%, var(--bg-void-2) 100%);
    font-family:'Rajdhani', sans-serif;
    color:var(--ivory);
    overflow:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }

  .stage{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
    padding:24px;
  }

  /* ---------- Watch case ---------- */
  .watch{
    position:relative;
    width:min(78vmin, 460px);
    height:min(78vmin, 460px);
    border-radius:50%;
    background:
      conic-gradient(from 220deg,
        var(--case-hi) 0deg,
        var(--case-lo) 45deg,
        var(--case-mid) 110deg,
        var(--case-hi) 160deg,
        var(--case-lo) 220deg,
        var(--case-mid) 280deg,
        var(--case-hi) 340deg,
        var(--case-hi) 360deg);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04),
      0 30px 60px -20px rgba(0,0,0,0.9),
      0 8px 20px rgba(0,0,0,0.6),
      inset 0 0 2px rgba(255,255,255,0.15);
  }

  .crown{
    position:absolute;
    right:-9px;
    top:50%;
    width:16px;
    height:34px;
    border-radius:3px;
    background:linear-gradient(90deg, var(--case-lo), var(--case-hi) 50%, var(--case-lo));
    box-shadow:0 0 0 1px rgba(0,0,0,0.6);
    background-size:100% 3px;
    transform:translateY(-50%) translateX(0px);
    transition:transform 0.35s cubic-bezier(.34,1.4,.5,1), box-shadow 0.35s ease;
    cursor:grab;
    touch-action:none;
  }

  .crown::before{
    content:"";
    position:absolute;
    inset:3px 2px;
    border-radius:2px;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,0.12) 0px, rgba(255,255,255,0.12) 1px, transparent 1px, transparent 4px);
    transform:translateX(var(--groove-shift, 0px));
    transition:transform 0.15s linear;
  }

  .crown.dragging{
    cursor:grabbing;
    transform:translateY(-50%) translateX(4px);
    box-shadow:0 0 0 1px rgba(0,0,0,0.6), 0 0 8px var(--teal-glow);
  }

  .bezel-ring{
    position:absolute;
    inset:5.5%;
    border-radius:50%;
    background:var(--dial-edge);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.06),
      inset 0 2px 6px rgba(0,0,0,0.9);
  }

  .dial{
    position:absolute;
    inset:8.5%;
    border-radius:50%;
    background:
      radial-gradient(circle at 35% 30%, #131418 0%, var(--dial) 55%, #000 100%);
    box-shadow:
      inset 0 0 22px rgba(0,0,0,0.85),
      inset 0 0 1px rgba(255,255,255,0.08);
    overflow:hidden;
  }

  .dial svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }

  /* ---------- center emblem ---------- */
  .emblem{
    position:absolute;
    left:50%;
    top:38%;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    pointer-events:none;
  }

  .emblem svg{
    width:15%;
    min-width:34px;
    filter:drop-shadow(0 0 4px var(--teal-glow));
  }

  .emblem .wordmark{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:clamp(8px, 2.6vmin, 13px);
    letter-spacing:0.22em;
    color:var(--teal);
    text-shadow:0 0 6px var(--teal-glow);
  }

  /* ---------- date window ---------- */
  .date-window{
    position:absolute;
    left:73%;
    top:50%;
    transform:translate(-50%,-50%);
    display:flex;
    align-items:center;
    gap:6px;
    padding:3px 7px;
    background:#000;
    border:1px solid #2b2c30;
    border-radius:2px;
    box-shadow:inset 0 0 3px rgba(0,0,0,0.9);
  }

  .date-window .dow{
    font-family:'JetBrains Mono', monospace;
    font-weight:500;
    font-size:clamp(7px, 1.7vmin, 10px);
    letter-spacing:0.08em;
    color:var(--ivory);
  }

  .date-window .dom{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:clamp(7px, 1.7vmin, 10px);
    color:var(--ivory);
  }

  /* ---------- hands ---------- */
  .hand{
    position:absolute;
    left:50%;
    bottom:50%;
    transform-origin:50% 100%;
    border-radius:3px;
  }

  .hand-hour{
    width:3.6%;
    height:26%;
    margin-left:-1.8%;
    background:linear-gradient(180deg, var(--teal), var(--teal-dim));
    box-shadow:0 0 5px var(--teal-glow);
    z-index:2;
  }

  .hand-minute{
    width:2.6%;
    height:37%;
    margin-left:-1.3%;
    background:linear-gradient(180deg, var(--teal), var(--teal-dim));
    box-shadow:0 0 5px var(--teal-glow);
    z-index:2;
  }

  .hand-second{
    width:1%;
    height:40%;
    margin-left:-0.5%;
    background:var(--magenta);
    box-shadow:0 0 6px var(--magenta-glow);
    z-index:3;
  }
  .hand-second::after{
    content:"";
    position:absolute;
    left:50%;
    bottom:-16%;
    width:600%;
    height:16%;
    transform:translateX(-50%);
    background:var(--magenta);
  }

  /* ---------- hand shadows (fixed light direction, independent of hand angle) ---------- */
  .hand-shadow{
    position:absolute;
    left:50%;
    bottom:50%;
    transform-origin:50% 100%;
    border-radius:3px;
    background:#000;
    pointer-events:none;
    z-index:1;
  }

  .shadow-hour{ width:3.6%; height:26%; margin-left:-1.8%; filter:blur(1px); opacity:0.32; }
  .shadow-minute{ width:2.6%; height:37%; margin-left:-1.3%; filter:blur(1.8px); opacity:0.28; }
  .shadow-second{ width:1%; height:40%; margin-left:-0.5%; filter:blur(2.6px); opacity:0.22; }

  .hub{
    position:absolute;
    left:50%;
    top:50%;
    width:3.4%;
    height:3.4%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--magenta), var(--magenta-dim));
    box-shadow:0 0 6px var(--magenta-glow), 0 0 0 2px #000;
    z-index:5;
  }

  .crystal-glare{
    position:absolute;
    inset:8.5%;
    border-radius:50%;
    background:linear-gradient(120deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 30%);
    pointer-events:none;
  }

  /* ---------- luminous ticks (always on: OLED true black + luminous) ---------- */
  #hourTicks,
  #minuteTicks{
    filter:brightness(1.55) drop-shadow(0 0 3px var(--teal-glow));
  }

  #numeral01{
    filter:brightness(1.35) drop-shadow(0 0 6px var(--magenta-glow));
  }

  /* ---------- ambient display mode ---------- */
  body[data-ambient="ambient"]{
    transition:background 0.6s ease;
    background:radial-gradient(ellipse at 50% 30%, #08090b 0%, #030304 60%, #000 100%);
  }

  body[data-ambient="ambient"] .caption{
    display:none;
  }

  /* strip the watch case chrome down to the glowing face itself */
  body[data-ambient="ambient"] .watch{
    background:none;
    box-shadow:none;
    cursor:pointer;
  }

  body[data-ambient="ambient"] .crown,
  body[data-ambient="ambient"] .bezel-ring,
  body[data-ambient="ambient"] .crystal-glare{
    display:none;
  }

  body[data-ambient="ambient"] .dial{
    background:none;
    box-shadow:none;
  }

  /* ---------- 39 mode glow pulse ---------- */
  .hand-second.pulse-39{
    filter:brightness(1.8) drop-shadow(0 0 8px var(--magenta-glow));
  }

  .hand-minute.pulse-39{
    filter:brightness(1.6) drop-shadow(0 0 8px var(--teal-glow));
  }

  /* ---------- caption ---------- */
  .caption{
    text-align:center;
  }

  .caption .title{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:clamp(14px, 3vmin, 20px);
    letter-spacing:0.35em;
    color:var(--ivory);
  }

  .caption .title span{
    color:var(--magenta);
  }

  .caption .subtitle{
    margin-top:4px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--ivory-dim);
  }

  .tz-readout{
    margin-top:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--ivory-dim);
  }

  .tz-readout #tzReadout{
    cursor:pointer;
  }

  .tz-readout .tz-offset{
    color:var(--magenta);
    font-weight:700;
  }

  .settings-btn{
    background:#000;
    color:var(--ivory-dim);
    border:1px solid var(--teal-dim);
    border-radius:50%;
    width:22px;
    height:22px;
    line-height:1;
    font-size:12px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    transition:color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, transform 0.3s ease;
  }

  .settings-btn:hover{
    color:var(--teal);
    border-color:var(--teal);
    box-shadow:0 0 4px var(--teal-glow);
  }

  .settings-btn.open{
    transform:rotate(45deg);
    color:var(--teal);
    border-color:var(--teal);
  }

  /* ---------- settings panel ---------- */
  .settings-panel{
    margin-top:16px;
    width:min(86vw, 300px);
    max-height:0;
    overflow:hidden;
    opacity:0;
    background:#0a0b0d;
    border:1px solid var(--teal-dim);
    border-radius:6px;
    box-shadow:0 12px 30px rgba(0,0,0,0.6);
    transition:max-height 0.35s ease, opacity 0.25s ease, padding 0.35s ease;
  }

  .settings-panel.open{
    max-height:min(70vh, 560px);
    overflow-y:auto;
    opacity:1;
    padding:14px 16px 16px;
  }

  .settings-panel::-webkit-scrollbar{
    width:6px;
  }
  .settings-panel::-webkit-scrollbar-track{
    background:transparent;
  }
  .settings-panel::-webkit-scrollbar-thumb{
    background:var(--teal-dim);
    border-radius:3px;
  }

  /* desktop: panel opens to the right of the watch instead of below it,
     so the watch itself never shifts from the page centre */
  @media (min-width: 1180px){
    .settings-panel{
      position:absolute;
      top:0;
      left:100%;
      margin-top:0;
      margin-left:24px;
      width:300px;
      max-height:none;
      max-width:0;
      opacity:0;
      overflow:hidden;
      transition:max-width 0.35s ease, opacity 0.25s ease, padding 0.35s ease;
    }

    .settings-panel.open{
      max-width:300px;
      max-height:calc(100vh - 48px);
      overflow-y:auto;
      opacity:1;
    }
  }

  .settings-panel h2,
  .face-gallery h2{
    margin:14px 0 6px;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:0.18em;
    color:var(--teal);
  }

  .settings-panel h2:first-child,
  .face-gallery h2:first-child{
    margin-top:0;
  }

  /* ---------- watch face gallery (mirrors the settings panel's open/closed state) ---------- */
  .face-gallery{
    margin-top:16px;
    width:min(86vw, 260px);
    max-height:0;
    overflow:hidden;
    opacity:0;
    background:#0a0b0d;
    border:1px solid var(--teal-dim);
    border-radius:6px;
    box-shadow:0 12px 30px rgba(0,0,0,0.6);
    transition:max-height 0.35s ease, opacity 0.25s ease, padding 0.35s ease;
  }

  .face-gallery.open{
    max-height:min(70vh, 560px);
    overflow-y:auto;
    opacity:1;
    padding:14px 16px 16px;
  }

  .face-gallery::-webkit-scrollbar{
    width:6px;
  }
  .face-gallery::-webkit-scrollbar-track{
    background:transparent;
  }
  .face-gallery::-webkit-scrollbar-thumb{
    background:var(--teal-dim);
    border-radius:3px;
  }

  @media (min-width: 1180px){
    .face-gallery{
      position:absolute;
      top:0;
      right:100%;
      margin-top:0;
      margin-right:24px;
      width:260px;
      max-height:none;
      max-width:0;
      opacity:0;
      overflow:hidden;
      transition:max-width 0.35s ease, opacity 0.25s ease, padding 0.35s ease;
    }

    .face-gallery.open{
      max-width:260px;
      max-height:calc(100vh - 48px);
      overflow-y:auto;
      opacity:1;
    }
  }

  .settings-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:4px 0;
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.03em;
    color:var(--ivory);
  }

  .settings-row input[type="radio"],
  .settings-row input[type="checkbox"]{
    accent-color:var(--teal);
    width:13px;
    height:13px;
    cursor:pointer;
  }

  .settings-row label{
    cursor:pointer;
  }

  /* ---------- left/right button toggles ---------- */
  .lr-row{
    justify-content:space-between;
  }

  .lr-toggle{
    display:flex;
    align-items:center;
    gap:8px;
  }

  .lr-btn{
    background:#000;
    color:var(--teal);
    border:1px solid var(--teal-dim);
    border-radius:4px;
    width:22px;
    height:22px;
    line-height:1;
    font-size:13px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }

  .lr-btn:hover{
    border-color:var(--teal);
    box-shadow:0 0 4px var(--teal-glow);
  }

  .lr-value{
    min-width:6.5em;
    text-align:center;
    color:var(--ivory);
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
  }

  /* ---------- volume slider ---------- */
  input[type="range"]{
    flex:1;
    accent-color:var(--teal);
    cursor:pointer;
  }

  .settings-panel select{
    width:100%;
    background:#000;
    color:var(--teal);
    border:1px solid var(--teal-dim);
    border-radius:3px;
    padding:5px 6px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.05em;
    outline:none;
    cursor:pointer;
  }

  .settings-panel select:focus{
    border-color:var(--teal);
    box-shadow:0 0 4px var(--teal-glow);
  }

  .settings-panel select optgroup{
    background:#0a0b0d;
    color:var(--magenta);
    font-style:normal;
    font-weight:700;
  }

  .settings-panel select option{
    background:#0a0b0d;
    color:var(--ivory);
  }

  .watch.hide-date .date-window{ visibility:hidden; }
  .watch.hide-seconds .hand-second,
  .watch.hide-seconds .shadow-second{ display:none; }

  .watch.tick-seconds .hand-second,
  .watch.tick-seconds .shadow-second{
    transition:transform 0.12s cubic-bezier(.2,1.8,.4,1);
  }

  /* ---------- collection / unlock system ---------- */
  .settings-row.locked{
    opacity:0.4;
  }

  .settings-row.locked label{
    cursor:not-allowed;
  }

  .face-hint{
    margin:-2px 0 4px 21px;
    font-size:9.5px;
    letter-spacing:0.02em;
    color:var(--ivory-dim);
  }

  .collection-count{
    color:var(--ivory-dim);
    font-weight:400;
    text-transform:none;
    letter-spacing:0.05em;
  }

  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translate(-50%, 20px);
    background:#0a0b0d;
    border:1px solid var(--teal);
    color:var(--ivory);
    padding:10px 18px;
    border-radius:6px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.05em;
    box-shadow:0 8px 24px rgba(0,0,0,0.5), 0 0 12px var(--teal-glow);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.3s ease, transform 0.3s ease;
    z-index:80;
    text-align:center;
  }

  .toast.show{
    opacity:1;
    transform:translate(-50%, 0);
  }

  .toast strong{
    color:var(--teal);
  }

  /* ---------- digital display format (independent of watch face/theme) ---------- */
  .digital-face{
    display:none;
    position:absolute;
    inset:0;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    z-index:4;
  }

  .watch.display-digital .digital-face{ display:flex; }

  .watch.display-digital svg,
  .watch.display-digital .emblem,
  .watch.display-digital .date-window,
  .watch.display-digital .hand,
  .watch.display-digital .hand-shadow,
  .watch.display-digital .hub{
    display:none;
  }

  .df-time{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:clamp(26px, 9vmin, 46px);
    letter-spacing:0.06em;
    color:var(--teal);
    text-shadow:0 0 12px var(--teal-glow);
  }

  .df-time .df-sec{
    color:var(--magenta);
    text-shadow:0 0 12px var(--magenta-glow);
  }

  .df-date{
    font-family:'JetBrains Mono', monospace;
    font-weight:500;
    font-size:clamp(10px, 2.6vmin, 13px);
    letter-spacing:0.25em;
    color:var(--ivory-dim);
  }

  .df-tz{
    font-family:'JetBrains Mono', monospace;
    font-size:clamp(8px, 2vmin, 10px);
    letter-spacing:0.18em;
    color:var(--magenta);
  }

  /* ---------- collectible face styles (Watchmaker presets) ---------- */
  /* each preset simply overrides the theme variables everything else already
     reads from, so hands/ticks/hub/case/emblem retheme automatically */

  .watch.face-cyan-circuit{
    --teal:#00eaff;
    --teal-dim:#0a6b78;
    --teal-glow:rgba(0,234,255,0.45);
    --magenta:#00eaff;
    --magenta-dim:#0a6b78;
    --case-hi:#12343a;
    --case-mid:#081a1e;
    --case-lo:#020506;
    --dial:#020a0c;
  }

  .watch.face-cyan-circuit .dial{
    background:
      repeating-linear-gradient(0deg, rgba(0,234,255,0.06) 0 1px, transparent 1px 24px),
      repeating-linear-gradient(90deg, rgba(0,234,255,0.06) 0 1px, transparent 1px 24px),
      radial-gradient(circle at 35% 30%, #0b1f22 0%, #020a0c 55%, #000 100%);
  }

  .hex-numeral{
    opacity:0;
    pointer-events:none;
  }

  .watch.face-cyan-circuit .hex-numeral{
    opacity:1;
  }

  .watch.face-night-miku .crystal-glare{ display:none; }
  .watch.face-night-miku .bezel-ring{ opacity:0.4; }

  .watch.face-anniversary15{
    --magenta:#d9a441;
    --magenta-dim:#7a5a1f;
    --magenta-glow:rgba(217,164,65,0.6);
    --case-hi:#4a3d28;
    --case-mid:#241d13;
    --case-lo:#100c07;
    --dial:#0d0a06;
  }

  .watch.face-classic{
    --teal:#e8e8ea;
    --teal-dim:#8a8b8d;
    --teal-glow:rgba(0,0,0,0);
    --magenta:#e8e8ea;
    --magenta-dim:#8a8b8d;
    --magenta-glow:rgba(0,0,0,0);
    --case-hi:#c9cbcf;
    --case-mid:#9a9ca0;
    --case-lo:#6b6d70;
    --dial:#101114;
    --dial-edge:#050506;
  }

  .watch.face-pure-white{
    --teal:#1a1a1a;
    --teal-dim:#4a4a4a;
    --teal-glow:rgba(0,0,0,0);
    --magenta:#c81e3a;
    --magenta-dim:#7a1424;
    --magenta-glow:rgba(200,30,58,0.35);
    --case-hi:#ffffff;
    --case-mid:#eeeeee;
    --case-lo:#d4d4d4;
    --dial:#ffffff;
    --dial-edge:#e4e4e4;
  }

  .watch.face-pure-white #hourTicks,
  .watch.face-pure-white #minuteTicks,
  .watch.face-pure-white #numeral01{
    filter:none;
  }

  .watch.face-pure-white .dial{
    background:radial-gradient(circle at 35% 30%, #ffffff 0%, #f2f2f2 55%, #dcdcdc 100%);
    box-shadow:
      inset 0 0 14px rgba(0,0,0,0.12),

<script>
  const svgNS = "http://www.w3.org/2000/svg";
  const minuteTicks = document.getElementById('minuteTicks');
  const hourTicks = document.getElementById('hourTicks');
  const numeral01 = document.getElementById('numeral01');

  // 60 minute ticks (thin teal), 12 hour ticks (bold teal), hour 1 in magenta as "01"
  for(let i=0;i<60;i++){
    const angle = (i * 6) * Math.PI/180;
    const isHour = i % 5 === 0;
    const rOuter = 92;
    const rInner = isHour ? 78 : 87;
    const x1 = 100 + rOuter*Math.sin(angle);
    const y1 = 100 - rOuter*Math.cos(angle);
    const x2 = 100 + rInner*Math.sin(angle);
    const y2 = 100 - rInner*Math.cos(angle);

    if(isHour){
      const hourIndex = i/5; // 0..11, where 0 = 12 o'clock
      const line = document.createElementNS(svgNS,'line');
      line.setAttribute('x1',x1); line.setAttribute('y1',y1);
      line.setAttribute('x2',x2); line.setAttribute('y2',y2);
      line.setAttribute('stroke-linecap','round');
      line.dataset.hourIndex = hourIndex;
      line.style.stroke = 'var(--teal)';
      line.setAttribute('stroke-width', 2.6);
      hourTicks.appendChild(line);
    } else {
      const line = document.createElementNS(svgNS,'line');
      line.setAttribute('x1',x1); line.setAttribute('y1',y1);
      line.setAttribute('x2',x2); line.setAttribute('y2',y2);
      line.setAttribute('stroke-linecap','round');
      minuteTicks.appendChild(line);
    }
  }

  // highlight one hour tick in magenta and place the numeral beside it;
  // which hour index gets the marker depends on the active watch face
  function setSpecialHourMarker(hourIndex, text){
    Array.from(hourTicks.children).forEach(line => {
      const isSpecial = Number(line.dataset.hourIndex) === hourIndex;
      line.style.stroke = isSpecial ? 'var(--magenta)' : 'var(--teal)';
      line.setAttribute('stroke-width', isSpecial ? 3.4 : 2.6);
    });
    const angle = (hourIndex * 30) * Math.PI/180;
    const r = 68;
    const x = 100 + r*Math.sin(angle);
    const y = 100 - r*Math.cos(angle) + 4;
    numeral01.setAttribute('x', x);
    numeral01.setAttribute('y', y);
    numeral01.textContent = text;
  }
  setSpecialHourMarker(1, '01');

  // hexadecimal hour numerals (A/B/C for 10/11/12), shown only on the Cyan Circuit face
  const svgRoot = numeral01.parentNode;
  [{ hourIndex: 10, text: 'A' }, { hourIndex: 11, text: 'B' }, { hourIndex: 0, text: 'C' }].forEach(({ hourIndex, text }) => {
    const angle = (hourIndex * 30) * Math.PI/180;
    const r = 68;
    const x = 100 + r*Math.sin(angle);
    const y = 100 - r*Math.cos(angle) + 4;
    const t = document.createElementNS(svgNS, 'text');
    t.setAttribute('x', x);
    t.setAttribute('y', y);
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('font-family', 'JetBrains Mono, monospace');
    t.setAttribute('font-weight', '700');
    t.setAttribute('font-size', '11');
    t.setAttribute('fill', 'var(--teal)');
    t.classList.add('hex-numeral');
    t.textContent = text;
    svgRoot.appendChild(t);
  });

  const hourHand = document.getElementById('hourHand');
  const minuteHand = document.getElementById('minuteHand');
  const secondHand = document.getElementById('secondHand');
  const hourHandShadow = document.getElementById('hourHandShadow');
  const minuteHandShadow = document.getElementById('minuteHandShadow');
  const secondHandShadow = document.getElementById('secondHandShadow');
  const dowEl = document.getElementById('dow');
  const domEl = document.getElementById('dom');
  const digitalTime = document.getElementById('digitalTime');
  const tzSelect = document.getElementById('tzSelect');
  const tzOffset = document.getElementById('tzOffset');
  const tzLabel = document.getElementById('tzLabel');
  const watchEl = document.getElementById('watch');
  const crownEl = document.getElementById('crown');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const showDateCheck = document.getElementById('showDate');
  const showSecondsCheck = document.getElementById('showSeconds');
  const mode39Check = document.getElementById('mode39');
  const soundCheck = document.getElementById('soundEnabled');
  const volumeSlider = document.getElementById('volumeSlider');
  const faceGallery = document.getElementById('faceGallery');
  const tzReadout = document.getElementById('tzReadout');
  const dfTime = document.getElementById('dfTime');
  const dfDate = document.getElementById('dfDate');
  const dfTz = document.getElementById('dfTz');

  function pad(n){ return n.toString().padStart(2,'0'); }

  const LOCAL_TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;

  const CITY_TIMEZONES = [
    { label: 'Midway Island', value: 'Pacific/Midway' },
    { label: 'Honolulu', value: 'Pacific/Honolulu' },
    { label: 'Anchorage', value: 'America/Anchorage' },
    { label: 'Los Angeles', value: 'America/Los_Angeles' },
    { label: 'Vancouver', value: 'America/Vancouver' },
    { label: 'Denver', value: 'America/Denver' },
    { label: 'Phoenix', value: 'America/Phoenix' },
    { label: 'Chicago', value: 'America/Chicago' },
    { label: 'Mexico City', value: 'America/Mexico_City' },
    { label: 'Bogota', value: 'America/Bogota' },
    { label: 'New York', value: 'America/New_York' },
    { label: 'Lima', value: 'America/Lima' },
    { label: 'Toronto', value: 'America/Toronto' },
    { label: 'Caracas', value: 'America/Caracas' },
    { label: 'Santiago', value: 'America/Santiago' },
    { label: 'Halifax', value: 'America/Halifax' },
    { label: 'Sao Paulo', value: 'America/Sao_Paulo' },
    { label: 'Buenos Aires', value: 'America/Argentina/Buenos_Aires' },
    { label: 'South Georgia', value: 'Atlantic/South_Georgia' },
    { label: 'Azores', value: 'Atlantic/Azores' },
    { label: 'Cape Verde', value: 'Atlantic/Cape_Verde' },
    { label: 'London', value: 'Europe/London' },
    { label: 'Dublin', value: 'Europe/Dublin' },
    { label: 'Lisbon', value: 'Europe/Lisbon' },
    { label: 'Casablanca', value: 'Africa/Casablanca' },
    { label: 'Paris', value: 'Europe/Paris' },
    { label: 'Berlin', value: 'Europe/Berlin' },
    { label: 'Madrid', value: 'Europe/Madrid' },
    { label: 'Rome', value: 'Europe/Rome' },
    { label: 'Lagos', value: 'Africa/Lagos' },
    { label: 'Athens', value: 'Europe/Athens' },
    { label: 'Helsinki', value: 'Europe/Helsinki' },
    { label: 'Cairo', value: 'Africa/Cairo' },
    { label: 'Johannesburg', value: 'Africa/Johannesburg' },
    { label: 'Moscow', value: 'Europe/Moscow' },
    { label: 'Istanbul', value: 'Europe/Istanbul' },
    { label: 'Riyadh', value: 'Asia/Riyadh' },
    { label: 'Nairobi', value: 'Africa/Nairobi' },

    { label: 'Dubai', value: 'Asia/Dubai' },

    { label: 'Kabul', value: 'Asia/Kabul' },

    { label: 'Yekaterinburg', value: 'Asia/Yekaterinburg' },

    { label: 'Manila', value: 'Asia/Manila' },
    { label: 'Tokyo', value: 'Asia/Tokyo' },
    { label: 'Seoul', value: 'Asia/Seoul' },
    { label: 'Adelaide', value: 'Australia/Adelaide' },
    { label: 'Sydney', value: 'Australia/Sydney' },
    { label: 'Brisbane', value: 'Australia/Brisbane' },
    { label: 'Guam', value: 'Pacific/Guam' },
    { label: 'Noumea', value: 'Pacific/Noumea' },
    { label: 'Auckland', value: 'Pacific/Auckland' },
    { label: 'Fiji', value: 'Pacific/Fiji' },
    { label: 'Tongatapu', value: 'Pacific/Tongatapu' },
    { label: 'Kiritimati', value: 'Pacific/Kiritimati' },
  ];

  function offsetInfo(tz){
    const parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'shortOffset' }).formatToParts(new Date());
    const raw = (parts.find(p => p.type === 'timeZoneName') || {}).value || 'GMT+0';
    const label = raw.replace('GMT', 'UTC');
    const m = raw.match(/GMT([+-])(\d+)(?::(\d+))?/);
    const minutes = m ? (m[1] === '-' ? -1 : 1) * (parseInt(m[2], 10) * 60 + parseInt(m[3] || '0', 10)) : 0;
    return { label, minutes };
  }

  // top-level options, always visible
  const TIMEZONES = [
    { label: 'Local Time', value: LOCAL_TZ },
    { label: 'UTC', value: 'UTC' },
  ];
  TIMEZONES.forEach(tz => {
    const opt = document.createElement('option');
    opt.value = tz.value;
    opt.textContent = tz.label;
    tzSelect.appendChild(opt);
  });

  // group remaining cities by their current UTC offset
  const groups = new Map();
  CITY_TIMEZONES.forEach(city => {
    const { label, minutes } = offsetInfo(city.value);
    if(!groups.has(label)) groups.set(label, { minutes, cities: [] });
    groups.get(label).cities.push(city);
  });

  Array.from(groups.entries())
    .sort((a, b) => a[1].minutes - b[1].minutes)
    .forEach(([offsetLabel, group]) => {
      const optgroup = document.createElement('optgroup');
      optgroup.label = offsetLabel;
      group.cities
        .slice()
        .sort((a, b) => a.label.localeCompare(b.label))
        .forEach(city => {
          const opt = document.createElement('option');
          opt.value = city.value;
          opt.textContent = city.label;
          optgroup.appendChild(opt);
        });
      tzSelect.appendChild(optgroup);
    });

  const TZ_LABEL_MAP = new Map(TIMEZONES.concat(CITY_TIMEZONES).map(t => [t.value, t.label]));
  const ALL_TZ_VALUES = TIMEZONES.map(t => t.value).concat(CITY_TIMEZONES.map(t => t.value));
  const savedTz = localStorage.getItem('miku-watch-tz');
  tzSelect.value = (savedTz && ALL_TZ_VALUES.includes(savedTz)) ? savedTz : LOCAL_TZ;

  tzSelect.addEventListener('change', () => {
    localStorage.setItem('miku-watch-tz', tzSelect.value);
    beginTimezoneSync();
    if(tzSelect.value === 'America/Los_Angeles') unlockFace('cyan-circuit');
    if(tzSelect.value === 'Asia/Tokyo') unlockFace('solar');
  });

  function getTimeParts(tz){
    const fmt = new Intl.DateTimeFormat('en-US', {
      timeZone: tz,
      hour12: false,
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      weekday: 'short',
      day: 'numeric',
      timeZoneName: 'shortOffset'
    });
    const parts = {};
    fmt.formatToParts(new Date()).forEach(p => { parts[p.type] = p.value; });
    let h = parseInt(parts.hour, 10) % 24;
    return {
      h,
      m: parseInt(parts.minute, 10),
      s: parseInt(parts.second, 10),
      dow: parts.weekday.toUpperCase(),
      dom: parseInt(parts.day, 10),
      offset: (parts.timeZoneName || '').replace('GMT', 'UTC')
    };
  }

  function rawDegrees(tz){
    const ms = new Date().getMilliseconds();
    const { h, m, s } = getTimeParts(tz);
    const h12 = h % 12;
    return {
      sec: (s + ms/1000) * 6,
      min: (m + s/60) * 6,
      hour: (h12 + m/60) * 30
    };
  }

  function totalMinutes12(tz){
    const { h, m, s } = getTimeParts(tz);
    return (h % 12) * 60 + m + s/60;
  }

  // displayed hour/minute-hand angles; the second hand always tracks real
  // time directly and is never touched by the sync animation below
  const initial = rawDegrees(tzSelect.value);
  const current = { hour: initial.hour, min: initial.min };

  const HOUR_DEG_PER_SEC = 60;   // 2 clock-hours/sec * 30deg/hour
  const MIN_DEG_PER_SEC = 720;   // 2 clock-hours/sec * 360deg/hour

  let sync = null; // {startTime, durationMs, fromHour, fromMin, toHour, toMin}

  function beginTimezoneSync(){
    const fromHour = current.hour;
    const fromMin = current.min;
    const fromMinutes = fromHour * 2; // hourDeg = minutes*0.5 => minutes = hourDeg*2
    const targetMinutes = totalMinutes12(tzSelect.value);
    const deltaMinutes = ((targetMinutes - fromMinutes) % 720 + 720) % 720;

    if(deltaMinutes < 0.01){
      sync = null;
      return;
    }

    sync = {
      startTime: performance.now(),
      durationMs: (deltaMinutes / 120) * 1000, // 2 clock-hours = 120 clock-minutes per real second
      fromHour, fromMin,
      toHour: fromHour + deltaMinutes * 0.5,
      toMin: fromMin + deltaMinutes * 6
    };
  }

  function applyHandAngles(sec, min, hour){
    secondHand.style.transform = `rotate(${sec}deg)`;
    minuteHand.style.transform = `rotate(${min}deg)`;
    hourHand.style.transform = `rotate(${hour}deg)`;

    secondHandShadow.style.transform = `translate(2px,2.5px) rotate(${sec}deg)`;
    minuteHandShadow.style.transform = `translate(1.5px,2px) rotate(${min}deg)`;
    hourHandShadow.style.transform = `translate(1px,1.5px) rotate(${hour}deg)`;
  }

  // ---------- sound engine (synthesized, no audio files) ----------
  let audioCtx = null;
  let startupChimePlayed = false;

  function getAudioCtx(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      audioCtx = new AC();
    }
    return audioCtx;
  }

  function soundReady(){
    return !!(soundCheck.checked && audioCtx && audioCtx.state === 'running');
  }

  function getVolume(){
    return Number(volumeSlider.value) / 100;
  }

  function playTone(freq, duration, gainPeak, type){
    if(!soundReady()) return;
    const ctx = audioCtx;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const t0 = ctx.currentTime;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, gainPeak * getVolume()), t0 + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(g).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  function playTick(){ playTone(2200, 0.02, 0.06, 'square'); }
  function playCrownClick(){ playTone(950, 0.03, 0.1, 'square'); }
  function playUiClick(){ playTone(1500, 0.02, 0.06, 'square'); }

  function playChime(){
    if(!soundReady()) return;
    [880, 1108.73, 1318.51].forEach((freq, i) => {
      const ctx = audioCtx;
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t0 = ctx.currentTime + i * 0.09;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0001, 0.09 * getVolume()), t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
      osc.connect(g).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.65);
    });
  }

  function ensureAudioReady(thenChime, afterReady){
    const ctx = getAudioCtx();
    if(!ctx) return;
    const proceed = () => {
      if(thenChime && !startupChimePlayed){ startupChimePlayed = true; playChime(); }
      if(afterReady) afterReady();
    };
    if(ctx.state === 'suspended') ctx.resume().then(proceed);
    else proceed();
  }

  soundCheck.checked = loadSetting('sound', '0') === '1';
  soundCheck.addEventListener('change', () => {
    saveSetting('sound', soundCheck.checked ? '1' : '0');
    if(soundCheck.checked){
      ensureAudioReady(true);
      unlockFace('terminal-green');
    }
  });
  if(soundCheck.checked){
    window.addEventListener('pointerdown', () => { if(soundCheck.checked) ensureAudioReady(true); }, { once: true });
  }

  volumeSlider.value = loadSetting('volume', '50');
  volumeSlider.addEventListener('input', () => {
    saveSetting('volume', volumeSlider.value);
    if(Number(volumeSlider.value) === 0) unlockFace('wood');
  });

  let lastTickSecond = null;
  let tickSecDeg = null; // continuously-growing angle used only in tick-seconds mode,
                          // so the 59->0 rollover animates forward 6deg instead of the
                          // CSS transition interpolating backward across 354deg

  function tick(){
    if(sync){
      const elapsedSec = (performance.now() - sync.startTime) / 1000;
      if(elapsedSec >= sync.durationMs / 1000){
        current.hour = sync.toHour;
        current.min = sync.toMin;
        sync = null;
      } else {
        current.hour = sync.fromHour + elapsedSec * HOUR_DEG_PER_SEC;
        current.min = sync.fromMin + elapsedSec * MIN_DEG_PER_SEC;
      }
    } else {
      const target = rawDegrees(tzSelect.value);
      current.hour = target.hour;
      current.min = target.min;
    }

    const { h, m, s, dow, dom, offset } = getTimeParts(tzSelect.value);
    const ms = new Date().getMilliseconds();

    // second hand always reflects live real time, independent of any sync spin
    const tickMode = watchEl.classList.contains('tick-seconds');
    let liveSec;
    if(tickMode){
      const target = s * 6;
      if(tickSecDeg === null){
        tickSecDeg = target;
      } else {
        let diff = target - (tickSecDeg % 360);
        if(diff < 0) diff += 360;
        tickSecDeg += diff;
      }
      liveSec = tickSecDeg;
    } else {
      tickSecDeg = null;
      liveSec = (s + ms/1000) * 6;
    }

    applyHandAngles(liveSec, current.min, current.hour);

    if(mode39Check.checked){
      secondHand.classList.toggle('pulse-39', s === 39);
      minuteHand.classList.toggle('pulse-39', m === 39 && s < 5);
      if(s === 39) unlockFace('anniversary15');
    } else {
      secondHand.classList.remove('pulse-39');
      minuteHand.classList.remove('pulse-39');
    }

    if(lastTickSecond !== null && s !== lastTickSecond) playTick();
    lastTickSecond = s;

    dowEl.textContent = dow;
    domEl.textContent = dom;
    digitalTime.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
    tzOffset.textContent = offset;
    tzLabel.textContent = TZ_LABEL_MAP.get(tzSelect.value) || tzSelect.value;

    dfTime.innerHTML = `${pad(h)}<span class="df-sec">:${pad(m)}:${pad(s)}</span>`;
    dfDate.textContent = `${dow} ${dom}`;
    dfTz.textContent = `${TZ_LABEL_MAP.get(tzSelect.value) || tzSelect.value} ${offset}`;

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ---------- settings panel ----------
  function saveSetting(key, value){ localStorage.setItem('miku-clock-' + key, value); }
  function loadSetting(key, fallback){
    const v = localStorage.getItem('miku-clock-' + key);
    return v === null ? fallback : v;
  }

  // ---------- watch face collection / unlock system ----------
  const FACES = [
    { id: 'night-miku', label: 'Night Miku', defaultUnlocked: true },
    { id: 'cyan-circuit', label: 'Cyan Circuit', defaultUnlocked: false, hint: 'Unlock: set timezone to California' },
    { id: 'anniversary15', label: '15th Anniversary', defaultUnlocked: false, hint: 'Unlock: witness a :39s glow (39 mode)' },
    { id: 'classic', label: 'Monochrome', defaultUnlocked: false, hint: 'Unlock: switch to Tick seconds' },
    { id: 'pure-white', label: 'Classic', defaultUnlocked: false, hint: 'Unlock: hide the date window' },
    { id: 'terminal-green', label: 'Terminal Green', defaultUnlocked: false, hint: 'Unlock: enable sound' },
    { id: 'rose-gold', label: 'Rose Gold', defaultUnlocked: false, hint: 'Unlock: hide the seconds hand' },
    { id: 'sakura', label: 'Sakura', defaultUnlocked: false, hint: 'Unlock: switch to Digital format' },
    { id: 'snow', label: 'Snow', defaultUnlocked: false, hint: 'Unlock: enter Ambient mode' },
    { id: 'wood', label: 'Wood', defaultUnlocked: false, hint: 'Unlock: set volume to 0' },
    { id: 'solar', label: 'Solar', defaultUnlocked: false, hint: 'Unlock: set timezone to Tokyo' },
  ];

  function loadUnlocked(){
    const validIds = FACES.map(f => f.id);
    const defaults = FACES.filter(f => f.defaultUnlocked).map(f => f.id);
    try{
      const stored = JSON.parse(localStorage.getItem('miku-watch-unlocked') || '[]').filter(id => validIds.includes(id));
      return Array.from(new Set(defaults.concat(stored)));
    }catch(err){
      return defaults;
    }
  }
  let unlockedFaces = loadUnlocked();
  function saveUnlocked(){ localStorage.setItem('miku-watch-unlocked', JSON.stringify(unlockedFaces)); }
  saveUnlocked(); // persist cleanup of any stale/removed face ids immediately
  function isUnlocked(id){ return unlockedFaces.includes(id); }

  let toastTimer = null;
  function showToast(msg){
    const el = document.getElementById('toast');
    el.innerHTML = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
  }

  function unlockFace(id){
    if(isUnlocked(id)) return;
    unlockedFaces.push(id);
    saveUnlocked();
    const face = FACES.find(f => f.id === id);
    showToast(`🎉 Unlocked: <strong>${face.label}</strong>`);
    renderFaceList();
  }

  function setWatchFace(face){
    if(!isUnlocked(face)) face = 'night-miku';
    FACES.forEach(f => watchEl.classList.remove('face-' + f.id));
    watchEl.classList.add('face-' + face);
    setSpecialHourMarker(face === 'anniversary15' ? 3 : 1, face === 'anniversary15' ? '15' : '01');
    saveSetting('watchFace', face);
  }

  function renderFaceList(){
    const container = document.getElementById('faceList');
    const countEl = document.getElementById('collectionCount');
    countEl.textContent = `(${unlockedFaces.length}/${FACES.length})`;
    container.innerHTML = '';
    FACES.forEach(face => {
      const locked = !isUnlocked(face.id);
      const row = document.createElement('div');
      row.className = 'settings-row' + (locked ? ' locked' : '');
      const inputId = 'face-' + face.id;
      row.innerHTML = `<input type="radio" name="watchFace" id="${inputId}" value="${face.id}"${locked ? ' disabled' : ''}>` +
        `<label for="${inputId}">${locked ? '🔒 ' : ''}${face.label}</label>`;
      container.appendChild(row);
      if(locked){
        const hint = document.createElement('div');
        hint.className = 'face-hint';
        hint.textContent = face.hint;
        container.appendChild(hint);
      }
    });
    const savedFace = loadSetting('watchFace', 'night-miku');
    const activeFace = isUnlocked(savedFace) ? savedFace : 'night-miku';
    const activeInput = document.getElementById('face-' + activeFace);
    if(activeInput) activeInput.checked = true;
    container.querySelectorAll('input[name="watchFace"]').forEach(r => {
      r.addEventListener('change', () => { if(r.checked) setWatchFace(r.value); });
    });
  }

  renderFaceList();
  setWatchFace(isUnlocked(loadSetting('watchFace', 'night-miku')) ? loadSetting('watchFace', 'night-miku') : 'night-miku');

  function setSecondsMotion(mode){
    watchEl.classList.toggle('tick-seconds', mode === 'tick');
    document.getElementById('secondsValue').textContent = mode === 'tick' ? 'Tick' : 'Smooth';
    saveSetting('secondsMotion', mode);
    if(mode === 'tick') unlockFace('classic');
  }
  setSecondsMotion(loadSetting('secondsMotion', 'smooth'));
  document.querySelectorAll('[data-group="seconds"]').forEach(btn => {
    btn.addEventListener('click', () => {
      setSecondsMotion(watchEl.classList.contains('tick-seconds') ? 'smooth' : 'tick');
    });
  });

  function setDisplayFormat(format){
    watchEl.classList.toggle('display-digital', format === 'digital');
    document.getElementById('formatValue').textContent = format === 'digital' ? 'Digital' : 'Analogue';
    saveSetting('displayFormat', format);
    if(format === 'digital') unlockFace('sakura');
  }
  setDisplayFormat(loadSetting('displayFormat', 'analog'));
  document.querySelectorAll('[data-group="format"]').forEach(btn => {
    btn.addEventListener('click', () => {
      setDisplayFormat(watchEl.classList.contains('display-digital') ? 'analog' : 'digital');
    });
  });

  function applyBoolSetting(checkbox, key, className, defaultValue, onChange){
    const saved = loadSetting(key, defaultValue ? '1' : '0') === '1';
    checkbox.checked = saved;
    watchEl.classList.toggle(className, !saved);
    checkbox.addEventListener('change', () => {
      watchEl.classList.toggle(className, !checkbox.checked);
      saveSetting(key, checkbox.checked ? '1' : '0');
      if(onChange) onChange(checkbox.checked);
    });
  }
  applyBoolSetting(showDateCheck, 'showDate', 'hide-date', true, (checked) => { if(!checked) unlockFace('pure-white'); });
  applyBoolSetting(showSecondsCheck, 'showSeconds', 'hide-seconds', true, (checked) => { if(!checked) unlockFace('rose-gold'); });

  mode39Check.checked = loadSetting('mode39', '1') === '1';
  mode39Check.addEventListener('change', () => saveSetting('mode39', mode39Check.checked ? '1' : '0'));

  // ---------- ambient display mode ----------
  let panelOpen = false;
  function setDisplayMode(mode){
    if(mode !== 'ambient') mode = 'full';
    document.body.dataset.ambient = mode;
    if(mode !== 'full') togglePanel(false);
    document.getElementById('ambientValue').textContent = mode === 'ambient' ? 'Ambient' : 'Full';
    saveSetting('ambient', mode);
    if(mode === 'ambient') unlockFace('snow');
  }
  setDisplayMode(loadSetting('ambient', 'full'));
  document.querySelectorAll('[data-group="ambient"]').forEach(btn => {
    btn.addEventListener('click', () => {
      setDisplayMode(document.body.dataset.ambient === 'ambient' ? 'full' : 'ambient');
    });
  });

  watchEl.addEventListener('click', () => {
    if(document.body.dataset.ambient === 'ambient') setDisplayMode('full');
  });

  window.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && document.body.dataset.ambient !== 'full') setDisplayMode('full');
  });

  function togglePanel(open){
    panelOpen = open !== undefined ? open : !panelOpen;
    settingsPanel.classList.toggle('open', panelOpen);
    settingsBtn.classList.toggle('open', panelOpen);
    settingsBtn.setAttribute('aria-expanded', panelOpen ? 'true' : 'false');
    faceGallery.classList.toggle('open', panelOpen);
  }
  settingsBtn.addEventListener('click', () => {
    if(soundCheck.checked) ensureAudioReady(false, playUiClick);
    togglePanel();
  });

  // ---------- crown: drag to cycle timezones, click to open the picker ----------
  const CROWN_STEP_PX = 28;
  let crownDragging = false;
  let crownStartX = 0;
  let crownStepsApplied = 0;
  let crownMoved = false;

  function stepTimezone(diff){
    const opts = tzSelect.options;
    const idx = Math.max(0, Math.min(opts.length - 1, tzSelect.selectedIndex + diff));
    if(idx !== tzSelect.selectedIndex){
      tzSelect.selectedIndex = idx;
      tzSelect.dispatchEvent(new Event('change'));
      playCrownClick();
    }
  }

  function onCrownMove(e){
    if(!crownDragging) return;
    const delta = e.clientX - crownStartX;
    if(Math.abs(delta) > 4) crownMoved = true;
    const grooveShift = Math.max(-3, Math.min(3, delta * 0.15));
    crownEl.style.setProperty('--groove-shift', grooveShift + 'px');
    const steps = Math.trunc(delta / CROWN_STEP_PX);
    if(steps !== crownStepsApplied){
      stepTimezone(steps - crownStepsApplied);
      crownStepsApplied = steps;
    }
  }

  function openTimezonePicker(){
    togglePanel(true);
    requestAnimationFrame(() => {
      if(typeof tzSelect.showPicker === 'function'){
        try{ tzSelect.showPicker(); }catch(err){ tzSelect.focus(); }
      } else {
        tzSelect.focus();
      }
    });
  }

  function onCrownUp(e){
    if(!crownDragging) return;
    crownDragging = false;
    crownEl.classList.remove('dragging');
    crownEl.style.setProperty('--groove-shift', '0px');
    try{ crownEl.releasePointerCapture(e.pointerId); }catch(err){}
    if(!crownMoved) openTimezonePicker();
  }

  crownEl.addEventListener('pointerdown', (e) => {
    crownDragging = true;
    crownStartX = e.clientX;
    crownStepsApplied = 0;
    crownMoved = false;
    crownEl.classList.add('dragging');
    try{ crownEl.setPointerCapture(e.pointerId); }catch(err){}
    if(soundCheck.checked) ensureAudioReady(false, playCrownClick);
  });
  crownEl.addEventListener('pointermove', onCrownMove);
  crownEl.addEventListener('pointerup', onCrownUp);
  crownEl.addEventListener('pointercancel', onCrownUp);

  document.getElementById('tzReadout').addEventListener('click', openTimezonePicker);

  // ---------- mobile gestures: swipe faces, swipe-up settings, tap-tilt inspect, pinch zoom, double-tap ambient ----------
  function cycleWatchFace(dir){
    const order = FACES.filter(f => isUnlocked(f.id)).map(f => f.id);
    const currentFace = FACES.find(f => watchEl.classList.contains('face-' + f.id))?.id || 'night-miku';
    const idx = order.indexOf(currentFace);
    const nextFace = order[((idx === -1 ? 0 : idx) + dir + order.length) % order.length];
    setWatchFace(nextFace);
    const input = document.getElementById('face-' + nextFace);
    if(input) input.checked = true;
  }

  function handleWatchTap(){
    if((document.body.dataset.ambient || 'full') === 'ambient'){
      setDisplayMode('full');
      return;
    }
    const now = Date.now();
    if(now - lastWatchTapTime < 350){
      setDisplayMode('ambient');
      lastWatchTapTime = 0;
    } else {
      lastWatchTapTime = now;
    }
  }

  let gestureTouch = null; // {startX, startY, startTime, moved}
  let pinch = null; // {startDist, startScale}
  let watchScale = 1;
  let lastWatchTapTime = 0;
  const TILT_MAX = 9;

  function touchDist(touches){
    return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
  }

  function applyWatchTransform(rx, ry){
    watchEl.style.transform = `scale(${watchScale}) perspective(700px) rotateX(${rx}deg) rotateY(${ry}deg)`;
  }

  function springWatchBack(){
    watchEl.style.transition = 'transform 0.4s cubic-bezier(.34,1.5,.4,1)';
    applyWatchTransform(0, 0);
    setTimeout(() => { watchEl.style.transition = ''; }, 400);
  }

  watchEl.addEventListener('touchstart', (e) => {
    if(e.target.closest('#crown')) return;
    if(e.touches.length === 2){
      pinch = { startDist: touchDist(e.touches), startScale: watchScale };
      gestureTouch = null;
    } else if(e.touches.length === 1){
      const t = e.touches[0];
      gestureTouch = { startX: t.clientX, startY: t.clientY, startTime: Date.now(), moved: false };
    }
  }, { passive: true });

  watchEl.addEventListener('touchmove', (e) => {
    if(pinch && e.touches.length === 2){
      watchScale = Math.min(1.8, Math.max(0.85, pinch.startScale * (touchDist(e.touches) / pinch.startDist)));
      watchEl.style.transition = 'none';
      applyWatchTransform(0, 0);
      return;
    }
    if(gestureTouch && e.touches.length === 1){
      const t = e.touches[0];
      const dx = t.clientX - gestureTouch.startX;
      const dy = t.clientY - gestureTouch.startY;
      if(Math.abs(dx) > 6 || Math.abs(dy) > 6) gestureTouch.moved = true;
      const ry = Math.max(-TILT_MAX, Math.min(TILT_MAX, dx * 0.12));
      const rx = Math.max(-TILT_MAX, Math.min(TILT_MAX, -dy * 0.12));
      watchEl.style.transition = 'none';
      applyWatchTransform(rx, ry);
    }
  }, { passive: true });

  watchEl.addEventListener('touchend', (e) => {
    if(pinch){
      pinch = null;
      e.preventDefault();
      return;
    }
    if(!gestureTouch) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - gestureTouch.startX;
    const dy = t.clientY - gestureTouch.startY;
    const elapsed = Date.now() - gestureTouch.startTime;
    const wasTap = !gestureTouch.moved && elapsed < 300;

    springWatchBack();
    e.preventDefault();

    if(wasTap){
      handleWatchTap();
    } else if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4){
      cycleWatchFace(dx > 0 ? -1 : 1);
    } else if(dy < -55 && Math.abs(dy) > Math.abs(dx) * 1.4){
      togglePanel(true);
    }
    gestureTouch = null;
  }, { passive: false });

</script>

</body>
